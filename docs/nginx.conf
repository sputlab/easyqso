# ============================================================
#  EasyQSO v2.1.0 — Configurazione Nginx
#  Da aggiungere al tuo virtual host (server block)
#  di solito in: /etc/nginx/sites-available/sputlab.com
# ============================================================

server {
    listen 443 ssl http2;
    server_name www.sputlab.com;

    # ... le tue direttive SSL, root, ecc. ...

    # ── EasyQSO API ──────────────────────────────────────────
    # Gestisce le chiamate REST e risponde al preflight CORS
    # PRIMA che Nginx faccia qualsiasi redirect
    location /webapp/easyqso/api/ {
        # Risponde direttamente al preflight OPTIONS senza passare per PHP
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  $http_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            add_header 'Access-Control-Max-Age'       86400 always;
            add_header 'Content-Length' 0;
            add_header 'Vary' 'Origin';
            return 204;
        }

        # Tutte le richieste /api/* → api/index.php
        try_files $uri $uri/ /webapp/easyqso/api/index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.1-fpm.sock;  # adatta al tuo socket PHP-FPM
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # ── EasyQSO App (pagine PHP normali) ─────────────────────
    location /webapp/easyqso/ {
        try_files $uri $uri/ /webapp/easyqso/index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.1-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # ── Blocca accesso diretto a includes/ ───────────────────
    location /webapp/easyqso/includes/ {
        deny all;
        return 403;
    }
}

# ── Redirect non-www → www (metti PRIMA del server block sopra) ──
server {
    listen 443 ssl http2;
    server_name sputlab.com;
    return 301 https://www.sputlab.com$request_uri;
}
